[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecbias"
version = "0.1.0"
description = "A transparent NLP workflow for earnings-call analysis."
requires-python = ">=3.11"
dependencies = [
  "gender-guesser>=0.4.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "spacy>=3.7",
  "statsmodels>=0.14",
  "textstat>=0.7",
  "vaderSentiment>=3.3",
  "streamlit>=1.30",
  "seaborn>=0.13",
  "typer>=0.9",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.0",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
ecbias = "ecbias.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_synthetic.py" = ["E501"]
"tests/test_ingest.py" = ["E501"]
"src/ecbias/cli.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
