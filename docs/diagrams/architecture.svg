<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <title>ECBias layered architecture</title>
  <desc>Five lanes show data, parsing, enrichment, NLP features, and statistics and outputs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <style>
      .title { font: 700 24px sans-serif; fill: #222; }
      .lane { font: 700 16px sans-serif; fill: #222; }
      .box { font: 14px sans-serif; fill: #222; }
      .arrow-label { font: 14px sans-serif; fill: #333; }
      .legend { font: 14px sans-serif; fill: #222; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="40" y="42" class="title">ECBias: transparent earnings-call analysis pipeline</text>
  <text x="40" y="68" class="legend">Each stage passes a named parquet, CSV, or model artefact to the next stage.</text>
  <g stroke="#d0d0d0" stroke-width="1">
    <rect x="30" y="95" width="220" height="570" rx="8" fill="#eeeeee"/>
    <rect x="270" y="95" width="220" height="570" rx="8" fill="#eadcf8"/>
    <rect x="510" y="95" width="220" height="570" rx="8" fill="#d9f0ed"/>
    <rect x="750" y="95" width="220" height="570" rx="8" fill="#cfeee9"/>
    <rect x="990" y="95" width="180" height="570" rx="8" fill="#eeeeee"/>
  </g>
  <text x="50" y="130" class="lane">Data</text>
  <text x="290" y="130" class="lane">Parsing</text>
  <text x="530" y="130" class="lane">Enrichment</text>
  <text x="770" y="130" class="lane">NLP features</text>
  <text x="1010" y="130" class="lane">Statistics and outputs</text>
  <g stroke="#555" stroke-width="1">
    <rect x="55" y="175" width="170" height="72" rx="8" fill="#eeeeee"/><rect x="55" y="305" width="170" height="72" rx="8" fill="#eeeeee"/>
    <rect x="55" y="435" width="170" height="72" rx="8" fill="#eeeeee"/>
    <rect x="295" y="175" width="170" height="72" rx="8" fill="#eadcf8"/><rect x="295" y="305" width="170" height="72" rx="8" fill="#eadcf8"/>
    <rect x="295" y="435" width="170" height="72" rx="8" fill="#eadcf8"/>
    <rect x="535" y="175" width="170" height="72" rx="8" fill="#d9f0ed"/><rect x="535" y="305" width="170" height="72" rx="8" fill="#d9f0ed"/>
    <rect x="535" y="435" width="170" height="72" rx="8" fill="#d9f0ed"/>
    <rect x="775" y="145" width="170" height="72" rx="8" fill="#cfeee9"/><rect x="775" y="275" width="170" height="72" rx="8" fill="#cfeee9"/>
    <rect x="775" y="405" width="170" height="72" rx="8" fill="#cfeee9"/><rect x="775" y="535" width="170" height="72" rx="8" fill="#cfeee9"/>
    <rect x="1005" y="205" width="150" height="72" rx="8" fill="#eeeeee"/><rect x="1005" y="365" width="150" height="72" rx="8" fill="#eeeeee"/>
    <rect x="1005" y="525" width="150" height="72" rx="8" fill="#eeeeee"/>
  </g>
  <g class="box" text-anchor="middle">
    <text x="140" y="202"><tspan x="140">Licensed transcripts</tspan><tspan x="140" dy="20">data/raw or fixtures</tspan></text>
    <text x="140" y="332"><tspan x="140">io.loaders</tspan><tspan x="140" dy="20">canonical turns</tspan></text>
    <text x="140" y="462"><tspan x="140">io.schema</tspan><tspan x="140" dy="20">validation</tspan></text>
    <text x="380" y="202"><tspan x="380">parsing.clean</tspan><tspan x="380" dy="20">normalised text</tspan></text>
    <text x="380" y="332"><tspan x="380">segmenter</tspan><tspan x="380" dy="20">Q&amp;A boundary</tspan></text>
    <text x="380" y="462"><tspan x="380">exchanges</tspan><tspan x="380" dy="20">exchange records</tspan></text>
    <text x="620" y="202"><tspan x="620">people.roles</tspan><tspan x="620" dy="20">speaker types</tspan></text>
    <text x="620" y="332"><tspan x="620">people.gender</tspan><tspan x="620" dy="20">salted IDs</tspan></text>
    <text x="620" y="462"><tspan x="620">people.enrich</tspan><tspan x="620" dy="20">gender metadata</tspan></text>
    <text x="860" y="172"><tspan x="860">argmining.sentences</tspan><tspan x="860" dy="20">sentence table</tspan></text>
    <text x="860" y="302"><tspan x="860">argmining.rules</tspan><tspan x="860" dy="20">labels and flags</tspan></text>
    <text x="860" y="432"><tspan x="860">features</tspan><tspan x="860" dy="20">response and interaction</tspan></text>
    <text x="860" y="562"><tspan x="860">scoring.aqs</tspan><tspan x="860" dy="20">transparent AQS</tspan></text>
    <text x="1080" y="232"><tspan x="1080">stats</tspan><tspan x="1080" dy="20">tables and summary</tspan></text>
    <text x="1080" y="392"><tspan x="1080">viz.figures</tspan><tspan x="1080" dy="20">PNG and SVG</tspan></text>
    <text x="1080" y="552"><tspan x="1080">Streamlit</tspan><tspan x="1080" dy="20">offline dashboard</tspan></text>
  </g>
  <g stroke="#333" stroke-width="1" fill="none" marker-end="url(#arrow)">
    <path d="M225 211 H295"/><path d="M380 247 V305"/><path d="M380 377 V435"/>
    <path d="M465 471 H535"/><path d="M620 247 V305"/><path d="M620 377 V435"/>
    <path d="M705 471 H775"/><path d="M860 217 V275"/><path d="M860 347 V405"/>
    <path d="M860 477 V535"/><path d="M945 571 H1005"/><path d="M1080 277 V365"/><path d="M1080 437 V525"/>
  </g>
  <g class="arrow-label" text-anchor="middle">
    <text x="260" y="202">raw rows</text><text x="420" y="290">turns.parquet</text><text x="420" y="420">qa turns</text>
    <text x="500" y="462">exchanges.parquet</text><text x="660" y="290">roles</text><text x="660" y="420">IDs</text>
    <text x="740" y="462">enriched.parquet</text><text x="900" y="260">sentences.parquet</text>
    <text x="900" y="390">labels</text><text x="900" y="520">features.parquet</text><text x="975" y="560">quality.parquet</text>
    <text x="1115" y="325">tables</text><text x="1115" y="485">figures</text>
  </g>
  <rect x="40" y="695" width="18" height="18" fill="#eadcf8"/><text x="66" y="710" class="legend">Data preparation and parsing</text>
  <rect x="285" y="695" width="18" height="18" fill="#cfeee9"/><text x="311" y="710" class="legend">NLP and statistics</text>
  <rect x="510" y="695" width="18" height="18" fill="#eeeeee"/><text x="536" y="710" class="legend">Inputs and outputs</text>
</svg>
