<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <title>Worked synthetic exchange dataflow</title>
  <desc>A synthetic example moves from raw turns through an exchange, sentence labels, features, and scores.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="1200" height="360" fill="#fff"/>
  <text x="40" y="42" font-family="sans-serif" font-size="24" font-weight="700">One synthetic exchange, end to end</text>
  <text x="40" y="70" font-family="sans-serif" font-size="16">Made-up text for demonstration; not a reported result.</text>
  <g stroke="#555" stroke-width="1">
    <rect x="35" y="125" width="190" height="130" rx="8" fill="#eeeeee"/>
    <rect x="270" y="125" width="190" height="130" rx="8" fill="#eadcf8"/>
    <rect x="505" y="125" width="190" height="130" rx="8" fill="#d9f0ed"/>
    <rect x="740" y="125" width="190" height="130" rx="8" fill="#cfeee9"/>
    <rect x="975" y="125" width="190" height="130" rx="8" fill="#eeeeee"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#222" text-anchor="middle">
    <text x="130" y="155"><tspan x="130" font-weight="700">Raw turns</tspan><tspan x="130" dy="24">Synthetic Analyst: What drove</tspan><tspan x="130" dy="20">growth?</tspan><tspan x="130" dy="20">Synthetic CFO: Sales improved.</tspan></text>
    <text x="365" y="155"><tspan x="365" font-weight="700">Exchange record</tspan><tspan x="365" dy="24">question_text</tspan><tspan x="365" dy="20">answer_text</tspan><tspan x="365" dy="20">exchange_id = 0</tspan></text>
    <text x="600" y="155"><tspan x="600" font-weight="700">Sentence labels</tspan><tspan x="600" dy="24">REQUEST: What drove growth?</tspan><tspan x="600" dy="20">CLAIM: Sales improved.</tspan></text>
    <text x="835" y="155"><tspan x="835" font-weight="700">Feature vector</tspan><tspan x="835" dy="24">relevance_tfidf</tspan><tspan x="835" dy="20">answer_words</tspan><tspan x="835" dy="20">tone_gap</tspan></text>
    <text x="1070" y="155"><tspan x="1070" font-weight="700">Scores</tspan><tspan x="1070" dy="24">AQS_q</tspan><tspan x="1070" dy="20">AQS_a</tspan><tspan x="1070" dy="20">hashed IDs only</tspan></text>
  </g>
  <g stroke="#333" stroke-width="1" fill="none" marker-end="url(#arrow)">
    <path d="M225 190 H270"/><path d="M460 190 H505"/><path d="M695 190 H740"/><path d="M930 190 H975"/>
  </g>
</svg>
